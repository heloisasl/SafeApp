<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeApp — Localização em tempo real</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1a1a2e;
      color: #ffffff;
      min-height: 100vh;
    }

    .header {
      background: #252540;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #333350;
    }

    .header-logo {
      width: 36px;
      height: 36px;
      background: #8B1A1A;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
    }

    .header-sub {
      font-size: 12px;
      color: #a0a0b0;
    }

    .status-bar {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4CAF50;
      animation: pulse 1.5s infinite;
    }

    .status-dot.offline {
      background: #666;
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    #map {
      width: 100%;
      height: calc(100vh - 200px);
      background: #111122;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .info-card {
      background: #252540;
      margin: 12px 16px;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #333350;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 13px;
      border-bottom: 1px solid #333350;
    }

    .info-row:last-child { border-bottom: none; }

    .info-label { color: #a0a0b0; }
    .info-value { color: #ffffff; font-weight: 500; }

    .loading {
      text-align: center;
      color: #666680;
      padding: 40px;
    }

    .loading-spinner {
      font-size: 32px;
      margin-bottom: 12px;
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .alert-banner {
      background: #B03A10;
      padding: 12px 20px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="alert-banner">🚨 ALARME ATIVO — Localização em tempo real</div>

  <div class="header">
    <div class="header-logo">🛡️</div>
    <div>
      <div class="header-title">SafeApp</div>
      <div class="header-sub">Você não está só</div>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Conectando...</span>
  </div>

  <div id="map">
    <div class="loading">
      <div class="loading-spinner">🛰️</div>
      <div>Aguardando localização...</div>
    </div>
  </div>

  <div class="info-card">
    <div class="info-row">
      <span class="info-label">Latitude</span>
      <span class="info-value" id="lat">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Longitude</span>
      <span class="info-value" id="lng">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Última atualização</span>
      <span class="info-value" id="timestamp">—</span>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
    import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDJb0g7zwFsCGZkvKr3OsBwwS-Ra7seAqo",
      authDomain: "safeapp-c925b.firebaseapp.com",
      databaseURL: "https://safeapp-c925b-default-rtdb.firebaseio.com",
      projectId: "safeapp-c925b",
      storageBucket: "safeapp-c925b.firebasestorage.app",
      messagingSenderId: "1086422967900",
      appId: "1:1086422967900:web:0fa43db0b2f756048fa899"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Pega o ID da sessão pela URL: ?id=XXXXX
    const params = new URLSearchParams(window.location.search);
    const sessaoId = params.get('id');

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const mapDiv = document.getElementById('map');

    if (!sessaoId) {
      statusDot.className = 'status-dot offline';
      statusText.textContent = 'Link inválido — ID não encontrado';
    } else {
      const alarmeRef = ref(db, `alarmes/${sessaoId}`);

      onValue(alarmeRef, (snapshot) => {
        const data = snapshot.val();

        if (!data) {
          statusDot.className = 'status-dot offline';
          statusText.textContent = 'Alarme encerrado ou inativo';
          mapDiv.innerHTML = '<div class="loading"><div>🔒</div><div style="margin-top:12px">Alarme encerrado</div></div>';
          return;
        }

        const { latitude, longitude, timestamp } = data;

        // Atualiza status
        statusDot.className = 'status-dot';
        statusText.textContent = 'Localização ativa — atualizando em tempo real';

        // Atualiza info
        document.getElementById('lat').textContent = latitude.toFixed(6);
        document.getElementById('lng').textContent = longitude.toFixed(6);
        document.getElementById('timestamp').textContent =
          new Date(timestamp).toLocaleTimeString('pt-BR');

        // Mostra mapa via Google Maps embed
        mapDiv.innerHTML = `
          <iframe
            width="100%"
            height="100%"
            frameborder="0"
            style="border:0"
            src="https://maps.google.com/maps?q=${latitude},${longitude}&z=16&output=embed"
            allowfullscreen>
          </iframe>
        `;
      });
    }
  </script>

</body>
</html>
